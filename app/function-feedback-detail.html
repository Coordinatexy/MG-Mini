<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>反馈详情 - 天工数智</title>
    <link rel="stylesheet" href="./vendor/fontawesome/css/all.min.css" />
    <link rel="stylesheet" href="./css/global.css" />
    <link rel="stylesheet" href="./css/function-feedback.css" />
    <link rel="stylesheet" href="./css/function-feedback-detail.css" />
  </head>
  <body>
    <div class="ios-frame-wrapper" role="img" aria-label="反馈详情页">
      <div class="ios-screen">
        <div class="top-header-shell">
          <div class="status-bar" role="img" aria-label="状态栏"></div>
          <div class="dynamic-island" aria-hidden="true"></div>
          <header class="title-bar" aria-label="页面标题">
            <a class="title-btn title-btn--back" href="./function-feedback-history.html" aria-label="返回反馈记录">
              <i class="fa-solid fa-chevron-left" aria-hidden="true"></i>
            </a>
            <h1 class="title-text">反馈详情</h1>
            <div class="mini-capsule" aria-label="微信小程序胶囊按钮">
              <img class="mini-left" src="./images/mini-capsule-menu.svg" alt="" aria-hidden="true" />
              <div class="mini-divider" aria-hidden="true"></div>
              <img class="mini-right" src="./images/mini-capsule-circle.svg" alt="" aria-hidden="true" />
            </div>
          </header>
        </div>

        <main class="screen-content feedback-screen">
          <section class="app-shell">
            <div id="feedbackDetailRoot" hidden>
              <section class="feedback-detail-status-card" aria-label="当前处理状态">
                <div class="feedback-detail-status-card__main">
                  <span class="feedback-status-badge" id="feedbackDetailStatusBadge">待受理</span>
                  <p class="feedback-detail-status-card__time" id="feedbackDetailUpdatedAt">更新时间</p>
                </div>
                <p class="feedback-detail-status-card__hint" id="feedbackDetailStatusHint">您的反馈已收到，请耐心等待处理。</p>
              </section>

              <section class="feedback-section" aria-labelledby="feedbackDetailInfoTitle">
                <div class="feedback-section__header">
                  <h2 id="feedbackDetailInfoTitle">反馈信息</h2>
                </div>
                <dl class="feedback-detail-meta">
                  <div><dt>企业</dt><dd id="feedbackDetailEnterprise">-</dd></div>
                  <div><dt>站点</dt><dd id="feedbackDetailSite">-</dd></div>
                  <div><dt>提交时间</dt><dd id="feedbackDetailCreatedAt">-</dd></div>
                </dl>
                <p class="feedback-detail-desc" id="feedbackDetailDescription"></p>
                <div class="feedback-detail-images" id="feedbackDetailImages" hidden aria-label="反馈图片"></div>
              </section>

              <section class="feedback-section" aria-labelledby="feedbackDetailTimelineTitle">
                <div class="feedback-section__header">
                  <h2 id="feedbackDetailTimelineTitle">处理进度</h2>
                </div>
                <ol class="feedback-timeline" id="feedbackDetailTimeline"></ol>
              </section>
            </div>

            <div class="feedback-image-preview" id="feedbackImagePreview" hidden role="dialog" aria-modal="true" aria-label="图片预览">
              <button class="feedback-image-preview__backdrop" type="button" id="feedbackImagePreviewBackdrop" aria-label="关闭图片预览"></button>
              <div class="feedback-image-preview__panel" role="document">
                <div class="feedback-image-preview__header" aria-hidden="true">
                  <span class="feedback-image-preview__counter" id="feedbackImagePreviewCounter">1 / 1</span>
                  <span class="feedback-image-preview__tips">左右滑动切换，双指缩放，拖拽查看</span>
                </div>
                <button class="feedback-image-preview__close" type="button" id="feedbackImagePreviewClose" aria-label="关闭预览">
                  <i class="fa-solid fa-xmark" aria-hidden="true"></i>
                </button>
                <button class="feedback-image-preview__nav feedback-image-preview__nav--prev" type="button" id="feedbackImagePreviewPrev" aria-label="上一张图片">
                  <i class="fa-solid fa-chevron-left" aria-hidden="true"></i>
                </button>
                <button class="feedback-image-preview__nav feedback-image-preview__nav--next" type="button" id="feedbackImagePreviewNext" aria-label="下一张图片">
                  <i class="fa-solid fa-chevron-right" aria-hidden="true"></i>
                </button>
                <div class="feedback-image-preview__stage">
                  <img id="feedbackImagePreviewImg" class="feedback-image-preview__image" alt="反馈图片预览" />
                </div>
              </div>
            </div>

            <div class="feedback-record-empty" id="feedbackDetailMissing" hidden>
              <div class="feedback-record-empty__icon" aria-hidden="true">
                <i class="fa-solid fa-circle-exclamation"></i>
              </div>
              <h2>未找到该反馈</h2>
              <p>记录可能已被删除或链接无效</p>
              <a class="feedback-record-empty__action" href="./function-feedback-history.html">返回反馈记录</a>
            </div>
          </section>
        </main>

        <div class="home-indicator" aria-hidden="true"></div>
      </div>
    </div>
    <script src="./js/feedback-store.js"></script>
    <script src="./js/function-feedback-detail.js"></script>
  </body>
</html>
