<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>运行模式 - 天工数智</title>
    <link rel="stylesheet" href="./vendor/fontawesome/css/all.min.css" />
    <link rel="stylesheet" href="./vendor/vant/index.css" />
    <link rel="stylesheet" href="./css/global.css" />
    <link rel="stylesheet" href="./css/function-mode.css" />
  </head>
  <body>
    <div class="ios-frame-wrapper" role="img" aria-label="运行模式管理页面">
      <div class="ios-screen">
        <div class="top-header-shell">
          <div class="status-bar" role="img" aria-label="状态栏"></div>
          <div class="dynamic-island" aria-hidden="true"></div>
          <header class="title-bar" aria-label="页面标题">
            <a class="title-btn title-btn--back" href="./function.html" aria-label="返回功能页">
              <i class="fa-solid fa-chevron-left" aria-hidden="true"></i>
            </a>
            <h1 class="title-text">运行模式</h1>
            <div class="mini-capsule" aria-label="微信小程序胶囊按钮">
              <img class="mini-left" src="./images/mini-capsule-menu.svg" alt="" aria-hidden="true" />
              <div class="mini-divider" aria-hidden="true"></div>
              <img class="mini-right" src="./images/mini-capsule-circle.svg" alt="" aria-hidden="true" />
            </div>
          </header>
        </div>

        <main class="screen-content mode-screen">
          <section class="app-shell mode-shell">
            <section class="mode-status-card">
              <i class="fa-regular fa-circle-dot" aria-hidden="true"></i>
              <span>当前运行模式：--</span>
            </section>

            <section class="mode-switcher" role="tablist" aria-label="运行模式切换">
              <button class="mode-switcher__tab is-active" type="button" role="tab" aria-selected="true" data-mode-tab="grid">并网模式</button>
              <button class="mode-switcher__tab" type="button" role="tab" aria-selected="false" data-mode-tab="off-grid">离网模式</button>
            </section>

            <section data-mode-panel="grid">
              <div class="mode-intro">储能并网模式切换操作&amp;校验模式</div>
              <div class="mode-steps" aria-label="并网模式步骤列表">
                <article class="mode-step"><span class="mode-step__index">1</span><h2>储能停机状态检测</h2></article>
                <article class="mode-step"><span class="mode-step__index">2</span><h2>电网合闸状态确认</h2></article>
                <article class="mode-step"><span class="mode-step__index">3</span><h2>储能切换并网模式</h2></article>
                <article class="mode-step"><span class="mode-step__index">4</span><h2>确认电网正常供电</h2></article>
                <article class="mode-step"><span class="mode-step__index">5</span><h2>设置储能开机</h2></article>
                <article class="mode-step"><span class="mode-step__index">6</span><h2>确认切换并网模式结果</h2></article>
              </div>
            </section>

            <section data-mode-panel="off-grid" hidden>
              <div class="mode-intro">储能离网模式切换操作&amp;校验模式</div>
              <div class="mode-steps" aria-label="离网模式步骤列表">
                <article class="mode-step"><span class="mode-step__index">1</span><h2>储能停机状态检测</h2></article>
                <article class="mode-step"><span class="mode-step__index">2</span><h2>储能SOC是否满足离网要求</h2></article>
                <article class="mode-step"><span class="mode-step__index">3</span><h2>储能最低功率是否满足离网要求</h2></article>
                <article class="mode-step"><span class="mode-step__index">4</span><h2>储能切换离网模式</h2></article>
                <article class="mode-step"><span class="mode-step__index">5</span><h2>电网断电状态确认</h2></article>
                <article class="mode-step"><span class="mode-step__index">6</span><h2>设置储能开机</h2></article>
                <article class="mode-step"><span class="mode-step__index">7</span><h2>确认切换离网模式结果</h2></article>
              </div>
            </section>
          </section>
        </main>

        <nav class="tab-bar" aria-label="底部标签栏">
          <a class="tab-item" href="./index.html">
            <span class="tab-icon" aria-hidden="true"><i class="fa-solid fa-house"></i></span>
            <span>概览</span>
          </a>
          <a class="tab-item active" href="./function.html" aria-current="page">
            <span class="tab-icon" aria-hidden="true"><i class="fa-solid fa-layer-group"></i></span>
            <span>功能</span>
          </a>
          <a class="tab-item" href="./message.html">
            <span class="tab-icon" aria-hidden="true"><i class="fa-solid fa-comment-dots"></i></span>
            <span>消息</span>
          </a>
          <a class="tab-item" href="./workbench.html">
            <span class="tab-icon" aria-hidden="true"><i class="fa-solid fa-suitcase"></i></span>
            <span>工作台</span>
          </a>
        </nav>

        <div class="home-indicator" aria-hidden="true"></div>
      </div>
    </div>
    <script src="./vendor/vant/vant.min.js"></script>
    <script src="./js/function-mode.js"></script>
  </body>
</html>
