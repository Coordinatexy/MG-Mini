<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>功能 - 天工数智</title>
    <link rel="stylesheet" href="./vendor/fontawesome/css/all.min.css" />
    <link rel="stylesheet" href="./vendor/vant/index.css" />
    <link rel="stylesheet" href="./css/global.css" />
    <link rel="stylesheet" href="./css/placeholder.css" />
  </head>
  <body>
    <div class="ios-frame-wrapper" role="img" aria-label="功能占位页">
      <div class="ios-screen">
        <div class="top-header-shell">
          <div class="status-bar" role="img" aria-label="状态栏"></div>
          <div class="dynamic-island" aria-hidden="true"></div>
          <header class="title-bar" aria-label="页面标题">
            <button class="title-btn title-btn--selector" type="button" id="functionEnterpriseSelectorTrigger" aria-haspopup="dialog" aria-expanded="false">
              <span class="title-btn__name" id="functionCurrentEnterpriseName" data-enterprise-name>天合富家</span>
              <i class="fa-solid fa-chevron-down" aria-hidden="true"></i>
            </button>
            <h1 class="title-text">功能</h1>
            <div class="mini-capsule" aria-label="微信小程序胶囊按钮">
              <img class="mini-left" src="./images/mini-capsule-menu.svg" alt="" aria-hidden="true" />
              <div class="mini-divider" aria-hidden="true"></div>
              <img class="mini-right" src="./images/mini-capsule-circle.svg" alt="" aria-hidden="true" />
            </div>
          </header>
        </div>
        <main class="screen-content placeholder-screen">
          <section class="app-shell">
            <section class="site-control-panel" aria-label="站点状态">
              <button class="site-switch" type="button" id="functionSiteSelectorTriggerInline" aria-label="切换站点" aria-haspopup="dialog" aria-expanded="false">
                <span class="site-switch__name" id="functionCurrentSiteNameInline" data-site-name>天合富家1#站点</span>
                <i class="fa-solid fa-chevron-down" aria-hidden="true"></i>
              </button>
            </section>

            <section class="feature-entry-grid" aria-label="功能入口">
              <a class="feature-entry-card" href="./function-strategy.html" aria-label="策略运行">
                <div class="feature-entry-card__icon"><i class="fa-solid fa-play"></i></div>
                <div class="feature-entry-card__content">
                  <h2>策略运行</h2>
                  <p>查看和启停策略执行状态</p>
                </div>
                <i class="fa-solid fa-chevron-right feature-entry-card__arrow" aria-hidden="true"></i>
              </a>

              <a class="feature-entry-card" href="./function-mode.html" aria-label="运行模式">
                <div class="feature-entry-card__icon"><i class="fa-solid fa-sliders"></i></div>
                <div class="feature-entry-card__content">
                  <h2>运行模式</h2>
                  <p>切换不同的系统运行模式</p>
                </div>
                <i class="fa-solid fa-chevron-right feature-entry-card__arrow" aria-hidden="true"></i>
              </a>

              <a class="feature-entry-card" href="./function-report.html" data-report-link aria-label="经营报告">
                <div class="feature-entry-card__icon"><i class="fa-solid fa-chart-line"></i></div>
                <div class="feature-entry-card__content">
                  <h2>经营报告</h2>
                  <p>进入经营分析与报告汇总</p>
                </div>
                <i class="fa-solid fa-chevron-right feature-entry-card__arrow" aria-hidden="true"></i>
              </a>

              <a class="feature-entry-card" href="./function-device-monitor.html" aria-label="设备监控">
                <div class="feature-entry-card__icon"><i class="fa-solid fa-desktop"></i></div>
                <div class="feature-entry-card__content">
                  <h2>设备监控</h2>
                  <p>查看设备运行状态与实时数据</p>
                </div>
                <i class="fa-solid fa-chevron-right feature-entry-card__arrow" aria-hidden="true"></i>
              </a>

              <a class="feature-entry-card" href="./function-feedback.html" data-feedback-link aria-label="问题反馈">
                <div class="feature-entry-card__icon"><i class="fa-solid fa-comment-dots"></i></div>
                <div class="feature-entry-card__content">
                  <h2>问题反馈</h2>
                  <p>提交问题并查看处理进度</p>
                </div>
                <i class="fa-solid fa-chevron-right feature-entry-card__arrow" aria-hidden="true"></i>
              </a>

              <a class="feature-entry-card" href="./function-help.html" aria-label="帮助中心">
                <div class="feature-entry-card__icon"><i class="fa-solid fa-circle-question"></i></div>
                <div class="feature-entry-card__content">
                  <h2>帮助中心</h2>
                  <p>查看常见问题与使用指引</p>
                </div>
                <i class="fa-solid fa-chevron-right feature-entry-card__arrow" aria-hidden="true"></i>
              </a>
            </section>
          </section>
        </main>
        <nav class="tab-bar" aria-label="底部标签栏">
          <a class="tab-item" href="./index.html">
            <span class="tab-icon" aria-hidden="true"><i class="fa-solid fa-house"></i></span>
            <span>概览</span>
          </a>
          <a class="tab-item active" href="./function.html" aria-current="page">
            <span class="tab-icon" aria-hidden="true"><i class="fa-solid fa-layer-group"></i></span>
            <span>功能</span>
          </a>
          <a class="tab-item" href="./message.html">
            <span class="tab-icon" aria-hidden="true"><i class="fa-solid fa-comment-dots"></i></span>
            <span>消息</span>
          </a>
          <a class="tab-item" href="./workbench.html">
            <span class="tab-icon" aria-hidden="true"><i class="fa-solid fa-suitcase"></i></span>
            <span>工作台</span>
          </a>
        </nav>

        <div class="picker-overlay" id="functionEnterprisePicker" aria-hidden="true">
          <button class="picker-backdrop" type="button" aria-label="关闭企业选择弹窗"></button>
          <section class="picker-sheet" role="dialog" aria-modal="true" aria-labelledby="functionEnterprisePickerTitle">
            <div class="picker-sheet__header">
              <h2 id="functionEnterprisePickerTitle">选择企业</h2>
              <button class="picker-close" type="button" id="functionEnterprisePickerClose">取消</button>
            </div>
            <label class="picker-search" for="functionEnterprisePickerSearch">
              <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
              <input id="functionEnterprisePickerSearch" type="search" placeholder="搜索企业名称" autocomplete="off" />
            </label>
            <div class="picker-sheet__list" id="functionEnterprisePickerList"></div>
          </section>
        </div>

        <div class="picker-overlay" id="functionSitePicker" aria-hidden="true">
          <button class="picker-backdrop" type="button" aria-label="关闭站点选择弹窗"></button>
          <section class="picker-sheet" role="dialog" aria-modal="true" aria-labelledby="functionSitePickerTitle">
            <div class="picker-sheet__header">
              <h2 id="functionSitePickerTitle">选择站点</h2>
              <button class="picker-close" type="button" id="functionSitePickerClose">取消</button>
            </div>
            <div class="picker-sheet__list" id="functionSitePickerList"></div>
          </section>
        </div>

        <div class="home-indicator" aria-hidden="true"></div>
      </div>
    </div>
    <script src="./vendor/vant/vant.min.js"></script>
    <script src="./js/common-selector.js"></script>
    <script src="./js/index.js"></script>
  </body>
</html>
