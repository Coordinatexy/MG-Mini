<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>反馈记录 - 天工数智</title>
    <link rel="stylesheet" href="./vendor/fontawesome/css/all.min.css" />
    <link rel="stylesheet" href="./css/global.css" />
    <link rel="stylesheet" href="./css/function-feedback.css" />
    <link rel="stylesheet" href="./css/function-feedback-history.css" />
  </head>
  <body>
    <div class="ios-frame-wrapper" role="img" aria-label="反馈记录页">
      <div class="ios-screen">
        <div class="top-header-shell">
          <div class="status-bar" role="img" aria-label="状态栏"></div>
          <div class="dynamic-island" aria-hidden="true"></div>
          <header class="title-bar" aria-label="页面标题">
            <a class="title-btn title-btn--back" href="./function.html" aria-label="返回功能页">
              <i class="fa-solid fa-chevron-left" aria-hidden="true"></i>
            </a>
            <h1 class="title-text">问题反馈</h1>
            <div class="mini-capsule" aria-label="微信小程序胶囊按钮">
              <img class="mini-left" src="./images/mini-capsule-menu.svg" alt="" aria-hidden="true" />
              <div class="mini-divider" aria-hidden="true"></div>
              <img class="mini-right" src="./images/mini-capsule-circle.svg" alt="" aria-hidden="true" />
            </div>
          </header>
        </div>

        <main class="screen-content feedback-screen">
          <section class="app-shell">
            <nav class="feedback-tabs" aria-label="问题反馈切换">
              <a class="feedback-tab" href="./function-feedback.html">问题反馈</a>
              <a class="feedback-tab active" href="./function-feedback-history.html" aria-current="page">反馈记录</a>
            </nav>

            <nav class="feedback-status-tabs" id="feedbackStatusTabs" aria-label="按状态筛选反馈记录">
              <button type="button" class="feedback-status-tab active" data-status="all" aria-pressed="true">全部</button>
              <button type="button" class="feedback-status-tab" data-status="pending" aria-pressed="false">待受理</button>
              <button type="button" class="feedback-status-tab" data-status="processing" aria-pressed="false">处理中</button>
              <button type="button" class="feedback-status-tab" data-status="completed" aria-pressed="false">已完成</button>
            </nav>

            <div class="feedback-record-list" id="feedbackRecordList" aria-label="历史反馈列表"></div>
            <div class="feedback-record-empty" id="feedbackRecordEmpty" hidden>
              <div class="feedback-record-empty__icon" aria-hidden="true">
                <i class="fa-solid fa-inbox"></i>
              </div>
              <h2>暂无反馈记录</h2>
              <p>提交问题后，可在此查看处理进度与结果</p>
              <a class="feedback-record-empty__action" href="./function-feedback.html">去提交反馈</a>
            </div>
          </section>
        </main>

        <div class="home-indicator" aria-hidden="true"></div>
      </div>
    </div>
    <script src="./js/feedback-store.js"></script>
    <script src="./js/function-feedback-history.js"></script>
  </body>
</html>
